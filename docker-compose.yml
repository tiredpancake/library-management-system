services:
  postgres:
    image: postgres:16
    container_name: library-postgres
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library_admin
      POSTGRES_PASSWORD: library_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_admin -d library_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/library-management
    image: library-backend:latest
    container_name: library-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/library_db
      SPRING_DATASOURCE_USERNAME: library_admin
      SPRING_DATASOURCE_PASSWORD: library_pass
      SECURITY_BASIC_USERNAME: admin
      SECURITY_BASIC_PASSWORD: test123
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    image: library-frontend:latest
    container_name: library-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
