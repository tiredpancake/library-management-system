services:
  postgres:
    image: postgres:16
    container_name: library-postgres
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library_admin
      POSTGRES_PASSWORD: library_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: library-backend:latest
    container_name: library-backend
    depends_on:
      - postgres
    environment:
      JWT_SECRET: library-management-system-secret-key-2026
    ports:
      - "8080:8080"

  frontend:
    image: library-frontend:latest
    container_name: library-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
